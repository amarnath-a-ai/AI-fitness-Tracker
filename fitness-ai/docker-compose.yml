version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: fitai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fitai_admin
      MONGO_INITDB_ROOT_PASSWORD: fitai_secret_2024
      MONGO_INITDB_DATABASE: fitness_tracker
    volumes:
      - mongodb_data:/data/db
      - ./database/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - fitai-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitai-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://fitai_admin:fitai_secret_2024@mongodb:27017/fitness_tracker?authSource=admin
      JWT_SECRET: fitai_jwt_super_secret_key_2024
      JWT_REFRESH_SECRET: fitai_jwt_refresh_super_secret_key_2024
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_URL: http://localhost:3000
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - fitai-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fitai-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    networks:
      - fitai-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: fitai-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock}
      MODEL_PATH: /app/data/models
    networks:
      - fitai-network

  nginx:
    image: nginx:alpine
    container_name: fitai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
      - ai-service
    networks:
      - fitai-network

volumes:
  mongodb_data:

networks:
  fitai-network:
    driver: bridge
